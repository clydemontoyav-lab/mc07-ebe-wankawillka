:root{--bg:#060C18;--bg2:#0C1726;--bg3:#111E30;--border:#1E3348;--border2:#2D5070;--blue:#1A73E8;--blue2:#4DA3FF;--green:#00C851;--yellow:#FFD700;--red:#FF4444;--purple:#BF7AFF;--orange:#FF8C00;--text:#F0F4FF;--text2:#8AB0D4;--text3:#4A6A8A;--radius:12px;--radius2:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;font-size:14px;}
.header{background:linear-gradient(135deg,#0A1422,#080E1F);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px;}
.logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1A73E8,#FFD700);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.h-title{font-size:14px;font-weight:800;color:var(--blue2);}
.h-sub{font-size:10px;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;}
.badge-meta{background:rgba(0,200,81,.12);color:var(--green);border:1px solid rgba(0,200,81,.3);border-radius:8px;padding:5px 12px;font-size:10px;font-weight:700;}
.main{padding:16px;max-width:1200px;margin:0 auto;}

/* SYNC STATUS */
.sync-bar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:8px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11px;}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.sync-dot.ok{background:var(--green);box-shadow:0 0 6px var(--green);}
.sync-dot.loading{background:var(--yellow);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-refresh{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:6px;padding:4px 10px;font-family:inherit;font-size:11px;cursor:pointer;}
.btn-refresh:hover{border-color:var(--blue2);color:var(--blue2);}

.config-panel{background:rgba(191,122,255,.06);border:1px solid rgba(191,122,255,.2);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;}
.config-title{font-size:12px;font-weight:700;color:var(--purple);margin-bottom:10px;}

.config-input:focus{border-color:var(--purple);}
